[project]
name = "rag-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mlbdzj", email = "2913152545@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.7.0",
    "chromadb>=1.5.9",
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.6.3",
    "openai>=3.17.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "reportlab>=5.0.1",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
